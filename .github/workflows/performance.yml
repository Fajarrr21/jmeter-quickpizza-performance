name: Performance Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: smoke | load | stress | spike
        default: smoke

jobs:
  jmeter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      quickpizza:
        image: ghcr.io/grafana/quickpizza-local:latest
        ports: ['3333:3333']
    env:
      JMETER_VERSION: '5.6.3'
      JMETER_HOME: /home/runner/apache-jmeter-5.6.3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: ${{ env.JMETER_HOME }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Install JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          curl -sSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" | tar -xz -C /home/runner

      - name: SLA checker self-test
        run: python scripts/test_sla_check.py

      - name: Wait for QuickPizza
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:3333/ready && exit 0; sleep 2; done
          echo "QuickPizza did not become ready" && exit 1

      - name: Run JMeter (${{ inputs.profile || 'smoke' }})
        run: bash scripts/run.sh "${{ inputs.profile || 'smoke' }}" # bash: Windows commits drop the +x bit

      - name: Publish summary
        if: ${{ !cancelled() }}
        run: cat results/*/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload HTML dashboard
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: results/
          retention-days: 14
